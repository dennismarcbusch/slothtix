{% extends "base.html" %}
{% block title %}Anmelden – SlothTix{% endblock %}
{% block content %}
<div class="card auth-card">
    <h1>Anmelden</h1>
    <form method="post" novalidate>
        {{ form.hidden_tag() }}
        <div class="field">
            {{ form.username.label }}
            {{ form.username(autofocus=true) }}
        </div>
        <div class="field">
            {{ form.password.label }}
            {{ form.password() }}
        </div>
        <button type="submit">Anmelden</button>
    </form>
</div>
{% endblock %}
