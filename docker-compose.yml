services:
  slothtix:
    build: .
    expose:
      - "8000"
    volumes:
      - slothtix-instance:/app/instance
      # UCS-CA-Zertifikat für die LDAPS-Prüfung, siehe LDAP_CA_CERT_PATH
      # in .env - Datei muss auf dem Host unter ./certs/ liegen.
      - ./certs:/app/certs:ro
    env_file:
      - .env
    restart: unless-stopped

  # Verschickt die morgendlichen Zusammenfassungen, die Agenten unter
  # /benachrichtigungen einschalten. Gleiches Image und gleiche Datenbank
  # wie slothtix, aber ohne Webserver - die Web-Worker laufen nur, wenn
  # jemand eine Seite aufruft.
  zusammenfassungen:
    build: .
    command: ["flask", "zusammenfassungen", "--dauerhaft"]
    # Leitet SIGTERM an Python weiter, damit `docker compose stop` nicht
    # zehn Sekunden auf den Kill wartet.
    init: true
    volumes:
      - slothtix-instance:/app/instance
    env_file:
      - .env
    depends_on:
      - slothtix
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    env_file:
      - .env
    depends_on:
      - slothtix
    restart: unless-stopped

volumes:
  slothtix-instance:
  caddy-data:
  caddy-config:
